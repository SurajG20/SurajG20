name: Profile README cards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-readme.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=SurajG20&show_icons=true&theme=default&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin GraphMind
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=SurajG20&repo=ai-repo-workspace&theme=default&hide_border=true
          path: profile/pin-graphmind.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin SiliconTrace
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=SurajG20&repo=silicon-trace&theme=default&hide_border=true
          path: profile/pin-silicon-trace.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --staged --quiet; then
            echo "No card changes"
          else
            git commit -m "Update profile stats cards"
            git push
          fi
